<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>胶囊小组件</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: transparent;
        }
        
        .capsule-container {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #4a90e2 0%, #357abd 100%);
            border-radius: 999px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            opacity: 1;
            transition: opacity 0.6s ease-in-out, filter 0.6s ease-in-out;
        }

        /* 空闲减淡状态：降低不透明度并轻微灰化 */
        .capsule-container.dim {
            opacity: 0.6;
            filter: saturate(0.5);
        }

        /* 闪烁提示动画：闪烁两次 */
        @keyframes flashHint {
            0% { opacity: 1; }
            25% { opacity: 0.2; }
            50% { opacity: 1; }
            75% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        .flash-hint {
            animation: flashHint 1.2s ease-in-out 2;
        }
    </style>
</head>
<body>
    <div class="capsule-container" id="capsule">
        <div class="widget-content">
            <div class="icon"></div>
            <div></div>
        </div>
    </div>

    <script>
        // 暴露给 Python 调用的接口：设置减淡状态
        window.setCapsuleDim = function(dimmed) {
            const capsule = document.getElementById('capsule');
            if (!capsule) return;
            if (dimmed) {
                capsule.classList.add('dim');
            } else {
                capsule.classList.remove('dim');
            }
        };

        // 页面渲染完成后，触发闪烁动画提示用户
        document.addEventListener('DOMContentLoaded', function() {
            // 等待一小段时间，确保页面完整渲染后再触发提示
            setTimeout(function() {
                const capsule = document.getElementById('capsule');
                if (capsule) {
                    capsule.classList.add('flash-hint');
                    // 动画结束后移除类名，避免影响后续交互
                    capsule.addEventListener('animationend', function() {
                        capsule.classList.remove('flash-hint');
                    });
                }
            }, 300);
        });
    </script>
</body>
</html>
