<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: transparent !important;
            overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
            user-select: none;
        }

        .interactive-zone {
            position: absolute; top: 0; left: 0; width: 100%; height: 40px; z-index: 999;
        }

        .island-capsule {
            position: relative; margin: 0 auto;
            width: 90px; height: 30px; /* 初始小胶囊 */
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        .island-capsule.active {
            width: 280px; height: 60px; border-radius: 40px;
        }

        .content-display {
            color: white; font-size: 26px; font-weight: 600; white-space: nowrap;
            opacity: 0; transform: scale(0.5); transition: all 0.3s ease;
        }

        .island-capsule.active .content-display {
            opacity: 1; transform: scale(1); transition-delay: 0.1s;
        }

        /* --- 样式变体 --- */
        /* 网络通知：绿色 */
        .mode-network { color: #4CAF50 !important; font-size: 18px !important; letter-spacing: 1px; }

        /* 蓝牙通知：蓝色 */
        .mode-bluetooth { color: #2196F3 !important; font-size: 18px !important; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="interactive-zone" id="triggerZone"></div>
    <div class="island-capsule" id="island">
        <div class="content-display" id="display">00:00:00</div>
    </div>

    <script>
        const island = document.getElementById('island');
        const display = document.getElementById('display');
        let isNotificationActive = false;

        function updateTime() {
            if (isNotificationActive) return;
            const now = new Date();
            display.textContent = now.toLocaleTimeString('en-US', { hour12: false });
        }
        setInterval(updateTime, 1000);
        updateTime();

        /**
         * 通用通知函数
         * @param {string} text - 显示的文字
         * @param {string} type - 通知类型 'network' | 'bluetooth'
         */

        let notificationTimer = null;
        let resetTimer = null;

        function showNotification(text, type) {

            clearTimeout(notificationTimer);
            clearTimeout(resetTimer);

            isNotificationActive = true;
            display.style.opacity = '0';

            setTimeout(() => {
                // 根据类型设置图标和样式
                let icon = "";
                let className = "";

                if (type === 'network') {
                    icon = "🟢 ";
                    className = "mode-network";
                } else if (type === 'bluetooth') {
                    icon = "🔵 "; // 蓝牙蓝点
                    className = "mode-bluetooth";
                }

                display.textContent = icon + text;
                display.classList.add(className);
                island.classList.add('active');
                display.style.opacity = '';
            }, 200);

            setTimeout(() => {
                island.classList.remove('active');
                setTimeout(() => {
                    display.className = "content-display"; // 清除所有额外类名
                    isNotificationActive = false;
                    updateTime();
                }, 400);
            }, 3500); // 展示3.5秒
        }

        // 供 Python 调用的接口
        function showNetworkNotification(msg) { showNotification(msg, 'network'); }
        function showBluetoothNotification(msg) { showNotification(msg, 'bluetooth'); }

        // 禁用整个文档的右键菜单
        document.addEventListener('contextmenu', event => event.preventDefault());

        const trigger = document.getElementById('triggerZone');
        trigger.addEventListener('mouseenter', () => { if(!isNotificationActive) island.classList.add('active'); });
        trigger.addEventListener('mouseleave', () => { if(!isNotificationActive) island.classList.remove('active'); });
    </script>
</body>
</html>
